[project]
name = "core"
version = "0.1.0"
description = "OpenMod VN core: compositional toxicity pipeline L0-L3"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "pydantic>=2.0",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "ahocorasick-rs>=1.0.3",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "httpx>=0.27"]
train = ["transformers>=4.40", "onnxruntime>=1.18", "datasets>=2.19"]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/core"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
